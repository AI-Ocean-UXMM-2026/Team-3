name: Backend verification

on:
  pull_request:
    paths: ["backend/**", "frontend/**", "order-parser/**", "scripts/**", "tools/**", "docs/**", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      # Includes isolated migration/rollback tests, contract drift and synthetic corpus.
      - run: python -m pytest -q --junitxml=../test-results.xml
      - run: node --test ../docs/examples/lannpya-client.test.mjs
      - run: npm run test:frontend && npm run build && npm run test:integration && npm run test:dashboard
        working-directory: .
        env:
          LANNPYA_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: npm ci --ignore-scripts && npm test && npm run typecheck
        working-directory: order-parser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-results
          path: test-results.xml
          retention-days: 7
